{% extends 'layout.html' %}
{% block title %}Agregar Matricula{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm">
    <h3 class="mb-3 text-center text-primary">Inscribir Nueva Matrícula</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Alumno</label>
            <input type="text" class="form-control" name="alumno" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Apoderado</label>
            <input type="text" class="form-control" name="apoderado" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Año Matrícula</label>
            <input type="number" class="form-control" name="anio" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary hover-glow">💾 Guardar</button>
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary hover-glow">↩️ Volver</a>
        </div>
    </form>
</div>
{% endblock %}
