<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Matriculas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">📚 CarvalloDB</a>
        <div class="d-flex align-items-center">
            <button id="theme-toggle" class="btn btn-outline-light me-3">🌙</button>
            <a href="{{ url_for('add_registration') }}" class="btn btn-light text-primary fw-semibold">+ Inscribir Matrícula</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Detectar tema guardado o usar preferencia del sistema
    const storedTheme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-bs-theme', storedTheme);
    const btn = document.getElementById('theme-toggle');

    function updateButtonIcon() {
        const current = document.documentElement.getAttribute('data-bs-theme');
        btn.textContent = current === 'dark' ? '☀️' : '🌙';
    }

    updateButtonIcon();

    btn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-bs-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        updateButtonIcon();
    });
</script>
</body>
</html>
