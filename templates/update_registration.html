{% extends 'layout.html' %}
{% block title %}Editar Matricula{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm">
    <h3 class="mb-3 text-center text-primary">Editar Matricula</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Alumno</label>
            <input type="text" class="form-control" name="alumno" value="{{ matricula['alumno'] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Apoderado</label>
            <input type="text" class="form-control" name="apoderado" value="{{ matricula['apoderado'] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Año</label>
            <input type="number" class="form-control" name="anio" value="{{ matricula['anio'] }}" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-success hover-glow">✅ Actualizar</button>
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary hover-glow">↩️ Volver</a>
        </div>
    </form>
</div>
{% endblock %}
